<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Legal OS">
  <title>Legal OS</title>
  <!-- Small-size variant of The Lens. Browser tabs render at 16-32px, where the
       six thin blades of the full mark merge into a disc, so this uses four
       wider blades on a larger ring. Circumference at r=20 is 125.66:
       four periods of 31.4 = 22 dash + 9.4 gap. -->
  <rect width="64" height="64" rx="13" fill="#112233"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#C6AD7C" stroke-width="5"
          stroke-dasharray="22 9.4" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="5.5" fill="#C6AD7C"/>
</svg>
